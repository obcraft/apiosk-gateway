# Apiosk's private SearXNG (https://github.com/searxng/searxng). Anything not
# set here uses SearXNG's defaults. The container serves on [::]:8080.
use_default_settings: true

general:
  instance_name: "Apiosk search"

server:
  # Private network only; the bot limiter needs Valkey and only matters for
  # public instances.
  limiter: false
  public_instance: false
  image_proxy: false
  # secret_key comes from the SEARXNG_SECRET Fly secret.

search:
  # The gateway reads results through the JSON API.
  formats:
    - html
    - json
