"app" = "apioskgateway"
"primary_region" = "ams"

["build"]
"dockerfile" = "Legacy.Dockerfile"

["env"]
"PORT" = "8080"
"RUST_LOG" = "info"
"SENTRY_DSN" = "https://0f5ca7c9a83b6f54cae811c560b2a218@o4511651012935680.ingest.de.sentry.io/4511651043016784"
"SENTRY_ENVIRONMENT" = "production"
"SENTRY_TRACES_SAMPLE_RATE" = "0.1"

["processes"]
"app" = ""
"research_worker" = "/usr/bin/env RESEARCH_WORKER_ENABLED=1 /app/apiosk-gateway"

["http_service"]
"internal_port" = 8080
"force_https" = true
"auto_stop_machines" = false
