app = "apiosk-gateway-v2"
primary_region = "ams"
kill_signal = "SIGINT"
kill_timeout = "120s"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ORIGIN = "https://app.apiosk.com"
  SUPABASE_URL = "https://api.apiosk.com"
  BIND_ADDRESS = "0.0.0.0:8082"
  INTENT_MODEL = "google/gemma-3-12b-it"
  ASK_V2_MODEL = "google/gemma-3-4b-it"
  RUST_LOG = "info"
  V2_EXECUTION_ENABLED = "1"
  KVK_WORKERS_ENABLED = "0" # The standalone KVK worker owns upstream retrieval.
  V2_SINGLE_CALL_MODE = "0"
  ASK_ENGINE_V2 = "true"
  WORKSPACE_CONTEXT_ENABLED = "true"
  EMBEDDED_EXECUTOR_ORIGIN = "http://127.0.0.1:8080"
  EMBEDDED_EXECUTOR_PORT = "8080"
  APIOSK_ENGINE_MODEL = "google/gemma-3-12b-it"
  # The one embedded executor process shares the 60-connection database with
  # v2; it gets 4 request + 1 log + 2 telemetry connections.
  GATEWAY_DB_POOL_SIZE = "4"
  GATEWAY_LOG_POOL_SIZE = "1"

[http_service]
  internal_port = 8082
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1024mb"
