app = "apiosk-gateway-v2"
primary_region = "ams"
kill_signal = "SIGINT"
kill_timeout = "120s"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ORIGIN = "https://app.apiosk.com"
  SUPABASE_URL = "https://api.apiosk.com"
  BIND_ADDRESS = "0.0.0.0:8082"
  # Apiosk's one model, via OpenRouter, for every stage. The code pins it and
  # ignores any other value; these lines only document it.
  INTENT_MODEL = "qwen/qwen3-30b-a3b-instruct-2507"
  ASK_V2_MODEL = "qwen/qwen3-30b-a3b-instruct-2507"
  RUST_LOG = "info"
  V2_EXECUTION_ENABLED = "1"
  ASK_PAID_ANALYSIS_ENABLED = "1"
  ASK_PAID_ANALYSIS_OWNERS = "bf085fe8-41c4-4699-978f-e75e89518bf7" # Private paid acceptance before broad rollout.
  RECURRING_ORDERS_ENABLED = "1" # Private production rollout; server owner allowlist still required.
  KVK_WORKERS_ENABLED = "0" # The standalone KVK worker owns upstream retrieval.
  V2_SINGLE_CALL_MODE = "0"
  ASK_ENGINE_V2 = "true"
  WORKSPACE_CONTEXT_ENABLED = "true"
  EMBEDDED_EXECUTOR_ORIGIN = "http://127.0.0.1:8080"
  EMBEDDED_EXECUTOR_PORT = "8080"
  APIOSK_ENGINE_MODEL = "qwen/qwen3-30b-a3b-instruct-2507"
  # The one embedded executor process shares the 60-connection database with
  # v2; it gets 4 request + 1 log + 2 telemetry connections.
  GATEWAY_DB_POOL_SIZE = "4"
  GATEWAY_LOG_POOL_SIZE = "1"

[http_service]
  internal_port = 8082
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1024mb"
