[package]
name = "nl-benefits"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["full"] }
url = { version = "2", features = ["serde"] }
roxmltree = "=0.20.0"
scraper = "0.24"
regex = "1"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
